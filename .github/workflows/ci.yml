name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # scripts/run-tests.mjs의 전체 테스트 한도(12분)에 설치·typecheck·build·CLI 계약 시간을 더한 값이다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify

  windows-schema:
    runs-on: windows-latest
    timeout-minutes: 10
    # 전체 Windows suite의 플랫폼/권한 제약과 구분해 컴파일러 경로 회귀와 설치 CLI 계약을 검사한다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test src/schema/orm/*.test.ts src/schema/client-binding.test.ts src/schema/module-resolver.test.ts src/schema/extract.test.ts
      - run: node --test --test-name-pattern="parse-error limitation" src/graph/build-graph.test.ts
      - run: npm run verify:cli
