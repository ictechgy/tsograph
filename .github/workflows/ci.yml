name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # scripts/run-tests.mjs의 전체 테스트 한도(12분)에 설치·typecheck·build·CLI 계약 시간을 더한 값이다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify

  node-versions:
    # engines는 Node 22.18.0 이상이다. 하한은 verify 잡이 맡고, 이후 LTS·Current 주 버전에서도 같은 검증을 돌린다.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  package-install:
    # 소스 dist가 아니라 npm에 올라갈 tarball을 격리 prefix에 설치해 같은 CLI 계약을 검사한다(files 목록 누락 등을 잡는다).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:build
      - name: Pack and install the tarball into an isolated prefix
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/tsograph-*.tgz
      - name: Verify the installed CLI
        run: |
          "$RUNNER_TEMP/prefix/bin/tsograph" --version
          TSOGRAPH_CLI="$RUNNER_TEMP/prefix/lib/node_modules/tsograph/dist/cli/main.js" node scripts/verify-cli-contract.mjs

  windows-schema:
    runs-on: windows-latest
    timeout-minutes: 10
    # 전체 Windows suite의 플랫폼/권한 제약과 구분해 컴파일러 경로 회귀와 설치 CLI 계약을 검사한다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test src/graph/package-configs.test.ts src/graph/config-scope.test.ts src/graph/pnp-path-normalization.test.ts src/graph/pnp-reserved-namespace.test.ts
      - run: node --test src/schema/orm/*.test.ts src/schema/client-binding.test.ts src/schema/module-resolver.test.ts src/schema/extract.test.ts
      - run: node --test --test-name-pattern="parse-error limitation" src/graph/build-graph.test.ts
      - run: npm run verify:cli
